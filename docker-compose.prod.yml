# VPS: docker compose -f docker-compose.prod.yml up -d --build
name: avito-agent

x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql://agent:${DB_PASSWORD:?задайте DB_PASSWORD в .env}@db:5432/agent
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped
  volumes:   # общие для всех сервисов: nightly обновляет, dialog сразу читает
    - ./data:/app/data
    - ./knowledge:/app/knowledge
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-app2: &app2
  <<: *app
  environment:
    DATABASE_URL: postgresql://agent:${DB_PASSWORD}@db:5432/agent
    DB_NS: "2"
    STORE_NAME: PREMIUM MARKET
    AVITO_CLIENT_ID: ${AVITO2_CLIENT_ID:-}
    AVITO_CLIENT_SECRET: ${AVITO2_CLIENT_SECRET:-}
    AVITO_TEST_CHAT_IDS: ${AVITO2_TEST_CHAT_IDS:-}
    VK_GROUP_ID: ${VK2_GROUP_ID:-}
    VK_GROUP_TOKEN: ${VK2_GROUP_TOKEN:-}
  volumes:
    - ./data2:/app/data
    - ./knowledge:/app/knowledge   # база знаний общая (30.10): пересборка вручную в основной копии (build_kb)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: agent
    ports:
      - "127.0.0.1:5432:5432"  # наружу не открываем
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "agent"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  gateway:
    <<: *app
    command: uvicorn services.avito_gateway.main:app --host 0.0.0.0 --port 8001
    ports:
      - "127.0.0.1:8001:8001"

  dialog:
    <<: *app
    command: python -m services.dialog.worker

  owner-bot:
    <<: *app
    command: python -m services.owner_bot.main

  broadcast:
    <<: *app
    command: python -m services.broadcast.worker

  nightly:
    <<: *app
    command: python -m services.nightly.worker
    volumes:   # + выгрузка PREMIUM MARKET: база знаний одна на оба аккаунта (30.10)
      - ./data:/app/data
      - ./knowledge:/app/knowledge
      - ./data2:/app/data2   # переписка PREMIUM для ручной пересборки базы знаний (build_kb --source all)

  content:   # автопостинг; какие площадки ведёт этот сервер — CONTENT_TARGETS в .env (vk | tg | пусто = обе)
    <<: *app
    command: python -m services.content.worker

  # Avito, аккаунт 2 (PREMIUM MARKET, 28.10) — та же программа: свои схемы в базе (DB_NS=2, общий только склад учёток),
  # свои data2/ (база знаний — общая knowledge/), ключи AVITO2_* и сообщество VK2_* из .env
  gateway2:
    <<: *app2
    command: uvicorn services.avito_gateway.main:app --host 0.0.0.0 --port 8001
    ports:
      - "127.0.0.1:8002:8001"

  dialog2:
    <<: *app2
    command: python -m services.dialog.worker

  owner-bot2:
    <<: *app2
    command: python -m services.owner_bot.main

  broadcast2:
    <<: *app2
    command: python -m services.broadcast.worker

  nightly2:
    <<: *app2
    command: python -m services.nightly.worker

  # Таблица учёток для владельца (браузер, телефон): NocoDB правит прямо sales.accounts под ролью sheet,
  # Caddy — HTTPS (второго пароля нет с 31.10). Настройка — scripts/sheet_setup.sh. Только РФ-сервер (DEPLOY_SERVICES)
  nocodb:
    image: nocodb/nocodb:2026.09.1
    environment:
      NC_AUTH_JWT_SECRET: ${NC_JWT_SECRET:-}
      NC_PUBLIC_URL: https://${SHEET_DOMAIN:-localhost}
      NC_DISABLE_TELE: "true"
      NC_ALLOW_LOCAL_EXTERNAL_DBS: "true"   # база — соседний контейнер db
    command: ["sh", "/nocodb_start.sh"]   # интерфейс по умолчанию на русском
    volumes:
      - nocodb:/usr/app/data
      - ./scripts/nocodb_start.sh:/nocodb_start.sh:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2.11-alpine
    environment:
      SHEET_DOMAIN: ${SHEET_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data   # сертификаты Let's Encrypt
    depends_on:
      - nocodb
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  pgdata:
  nocodb:
  caddy:
